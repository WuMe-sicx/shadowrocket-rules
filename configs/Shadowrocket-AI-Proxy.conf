## 维护说明

- 修改规则时优先检查 AI 域名是否被更早的规则覆盖。
- 新增规则前核实域名用途，避免误拦截业务 API。
- 本配置当前未引用仓库的超大规则模块，避免把模块中的固定策略（DIRECT/PROXY/REJECT）与自定义代理组产生冲突。
- 本配置未在真实 iPhone 上验证；导入后请测试 AI 登录、API 请求、国内网站和广告过滤效果。
